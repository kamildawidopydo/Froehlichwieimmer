<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-label="Zinswissen — Grundlagen kompakt">
  <rect width="1080" height="1080" fill="#ECF3FA"/>
  <path d="M0 760 Q 360 680 720 740 T 1080 700 L 1080 1080 L 0 1080 Z" fill="#4C7CBA" opacity="0.08"/>

  <!-- Book -->
  <rect x="240" y="260" width="600" height="440" rx="16" fill="#1F2937"/>
  <rect x="260" y="280" width="560" height="400" rx="8" fill="#FFFFFF"/>
  <line x1="540" y1="280" x2="540" y2="680" stroke="#B5CBE2" stroke-width="3"/>

  <!-- Left page: percent -->
  <text x="400" y="470" text-anchor="middle" font-family="'IBM Plex Sans','Helvetica Neue',sans-serif" font-weight="700" font-size="160" fill="#4C7CBA">%</text>
  <text x="400" y="540" text-anchor="middle" font-family="'IBM Plex Sans','Helvetica Neue',sans-serif" font-size="22" fill="#6B7280">Zins &amp; Rendite</text>

  <!-- Right page: curve -->
  <path d="M 580 610 Q 640 540 720 480 T 820 340" stroke="#4C7CBA" stroke-width="6" fill="none" stroke-linecap="round"/>
  <polygon points="820,340 796,354 800,326" fill="#4C7CBA"/>
  <line x1="580" y1="610" x2="820" y2="610" stroke="#B5CBE2" stroke-width="3"/>
  <line x1="580" y1="610" x2="580" y2="340" stroke="#B5CBE2" stroke-width="3"/>

  <!-- Corner tag -->
  <rect x="720" y="200" width="180" height="60" rx="30" fill="#4C7CBA"/>
  <text x="810" y="240" text-anchor="middle" font-family="'IBM Plex Sans','Helvetica Neue',sans-serif" font-weight="700" font-size="22" fill="#FFFFFF">Ratgeber</text>

  <text x="540" y="820" text-anchor="middle" font-family="'IBM Plex Sans','Helvetica Neue',sans-serif" font-weight="600" font-size="50" fill="#1F2937">Zinswissen kompakt</text>
  <text x="540" y="870" text-anchor="middle" font-family="'IBM Plex Sans','Helvetica Neue',sans-serif" font-size="26" fill="#3A6499">Grundlagen einfach erklärt</text>
</svg>
