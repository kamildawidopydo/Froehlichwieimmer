<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-label="Fröhlich Vermögensberatung">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ECF3FA"/>
      <stop offset="1" stop-color="#DDE9F6"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C7CBA"/>
      <stop offset="1" stop-color="#3A6499"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <g transform="translate(540 500)">
    <circle r="220" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.6"/>
    <circle r="150" fill="#FFFFFF" stroke="#4C7CBA" stroke-width="3"/>
    <text x="0" y="14" text-anchor="middle"
          font-family="'IBM Plex Sans', 'Helvetica Neue', system-ui, sans-serif"
          font-weight="700" font-size="80" fill="#4C7CBA" letter-spacing="-3">FV</text>
    <text x="0" y="300" text-anchor="middle"
          font-family="'IBM Plex Sans', 'Helvetica Neue', system-ui, sans-serif"
          font-weight="500" font-size="34" fill="#3A6499" letter-spacing="8">FRÖHLICH VERMÖGENSBERATUNG</text>
  </g>
</svg>
