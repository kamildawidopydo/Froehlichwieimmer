crons:
  # Stündlicher RSS-Fetch (Roh-Items nach news_raw). Endpoint acked 2xx sofort
  # und feuert die Arbeit via asyncio.create_task (Bearer via WEBHOOK_CRON_SECRET).
  - name: news-fetch-feeds
    description: "Stündlich RSS-Feeds abrufen und in news_raw speichern"
    cron: "0 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/news-fetch-feeds"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.

  # Stündliche News-Synthese via Claude Sonnet 5. Läuft 10 Min nach dem Fetch,
  # damit alle Feeds persistiert sind. Long-running (~5-10 Min) — daher als
  # Background-Task, damit die ~5s Cron-Ack-Deadline eingehalten wird.
  - name: news-synthesize
    description: "Stündlich bis zu 25 konsolidierte Artikel synthetisieren (background)"
    cron: "10 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/news-synthesize"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.

  # 15-Minute-Auswertung der Aktien-Alarme (Session 80.83 · Watchlist Pro 4/4).
  # Endpoint acked 2xx sofort und feuert die Auswertung via asyncio.create_task.
  - name: stock-alerts-evaluate
    description: "Alle 15 Min persönliche Aktien-Alarme evaluieren (background)"
    cron: "*/15 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/stock-alerts-evaluate"
    method: POST
