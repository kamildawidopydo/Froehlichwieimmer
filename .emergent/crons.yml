crons:
  # Stündlicher RSS-Fetch (Roh-Items nach news_raw). Endpoint acked 2xx sofort
  # und feuert die Arbeit via asyncio.create_task (Bearer via WEBHOOK_CRON_SECRET).
  - name: news-fetch-feeds
    description: "Stündlich RSS-Feeds abrufen und in news_raw speichern"
    cron: "0 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/news-fetch-feeds"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.

  # Stündliche News-Synthese via Claude Sonnet 5. Läuft 10 Min nach dem Fetch,
  # damit alle Feeds persistiert sind. Long-running (~5-10 Min) — daher als
  # Background-Task, damit die ~5s Cron-Ack-Deadline eingehalten wird.
  - name: news-synthesize
    description: "Stündlich bis zu 25 konsolidierte Artikel synthetisieren (background)"
    cron: "10 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/news-synthesize"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.

  # 15-Minute-Auswertung der Aktien-Alarme (Session 80.83 · Watchlist Pro 4/4).
  # Endpoint acked 2xx sofort und feuert die Auswertung via asyncio.create_task.
  - name: stock-alerts-evaluate
    description: "Alle 15 Min persönliche Aktien-Alarme evaluieren (background)"
    cron: "*/15 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/stock-alerts-evaluate"
    method: POST

  # Täglicher IPO-Katalog-Sync gegen Euronext + Nasdaq (Session 82.06). Läuft
  # source-isoliert (Nasdaq-Fail bricht Euronext nicht ab), Manual-Override
  # geschützt. Endpoint acked 2xx sofort und startet den Sync als
  # asyncio-Background-Task. 04:30 UTC (~ 06:30 Europe/Berlin Sommer / 05:30 Winter).
  # Täglicher Bond-Katalog-Sync gegen Deutsche Börse XFRA-BF (Session 82.17).
  # 05:35 UTC — nach IPO-Cron und nach Deutsche-Börse-Datei-Refresh.
  # Kuratiert 1000 EUR/DE-EU-ISIN-Bonds mit Cap-Sort DE/AT/FR/NL/BE/LU → XS →
  # Rest. Manual-Override geschützt. Endpoint acked 2xx sofort und startet
  # den Sync als asyncio-Background-Task. History in `bond_sync_runs` (30).
  - name: bond-catalog-sync
    description: "Täglich Bond-Katalog aus Deutsche Börse XFRA-BF synchronisieren"
    cron: "35 5 * * *"
    endpoint: "{{BASE_URL}}/api/cron/bond-catalog-sync"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.

  # Täglicher Portfolio-Snapshot pro Kunde (Session 82.25 · Vermögensverlauf).
  # 22:00 UTC — nach US-Market-Close, damit die Tages-Bewertung stabil ist.
  # Idempotent per (user_id, snapshot_date): erneuter Lauf am gleichen Tag
  # aktualisiert den bestehenden Snapshot, statt einen zweiten zu erzeugen.
  # Endpoint acked 2xx sofort und startet den Batch als asyncio-Background-Task.
  - name: portfolio-snapshots
    description: "Täglich pro Kunde einen Portfolio-Snapshot upserten"
    cron: "0 22 * * *"
    endpoint: "{{BASE_URL}}/api/cron/portfolio-snapshots"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.

  # 15-Minuten-Matcher für pending Limit-Buy-Orders (Session 82.27).
  # Verwendet dieselbe Execution-Saga wie der Admin-Endpoint (82.26).
  # KEIN Echtzeit-Matching — reine periodische Prüfung; die UI kommuniziert
  # das entsprechend ("Wird automatisch geprüft" statt "sofort ausgeführt").
  # Endpoint acked 2xx sofort und startet den Matcher als asyncio-Background-Task.
  - name: portfolio-matcher
    description: "Alle 15 Min pending Limit-Buy-Orders gegen echte Quotes matchen"
    cron: "*/15 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/portfolio-matcher"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
