crons:
  # Stündliche Nachrichten-Aktualisierung (User-Vorgabe: 0 * * * *).
  # Beide Cron-Jobs teilen sich denselben Endpoint mit Mongo-Lock — parallele
  # Läufe werden atomar verhindert (siehe fetch_feeds).
  - name: news-hourly-refresh
    schedule: "0 * * * *"
    endpoint: "/api/news/admin/fetch-feeds?trigger=hourly_cron"
    method: POST
    auth: admin
    description: "Stündliches News-Refresh — fetch RSS, insert new, update changed titles/summaries/images."

  - name: news-fetch-feeds
    schedule: "*/15 * * * *"
    endpoint: "/api/news/admin/fetch-feeds?trigger=15min_cron"
    method: POST
    auth: admin
    description: "Ergänzender 15-Min-Fetch für maximale Aktualität — überspringt sauber, wenn hourly gerade läuft."

  - name: news-synthesize
    schedule: "0 * * * *"
    endpoint: "/api/news/admin/synthesize"
    method: POST
    auth: admin
    description: "Stündlich bis zu 3 neue Fröhlich-Redaktionsartikel via Claude Sonnet 5 synthetisieren."

  - name: price-alerts-check
    schedule: "*/15 * * * *"
    endpoint: "/api/alerts/admin/check-triggers"
    method: POST
    auth: admin
    description: "Alle 15 Min aktive Preis-Alerts prüfen und ggf. Kursalarm-Mail versenden (Cooldown 6h)."
