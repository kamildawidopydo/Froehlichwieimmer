<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="55%" stop-color="#123d66"/>
      <stop offset="100%" stop-color="#0d3358"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C547"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a4a7a"/>
      <stop offset="100%" stop-color="#0f3558"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#dots)"/>
  
    
  <text x="80" y="420" fill="#fff" font-family="system-ui,sans-serif" font-size="56" font-weight="800">Frankfurt</text>
  <text x="80" y="490" fill="rgba(255,255,255,0.82)" font-family="system-ui,sans-serif" font-size="28">Persönliche Betreuung aus dem Büro</text>
  <rect x="80" y="520" width="220" height="4" rx="2" fill="url(#gold)"/>
    <rect x="120" y="620" width="840" height="400" rx="28" fill="url(#card)" stroke="rgba(201,162,39,0.3)" stroke-width="2"/>
    <text x="540" y="760" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="48" font-weight="700">Frankfurt am Main</text>
    <text x="540" y="830" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-family="system-ui,sans-serif" font-size="26">Mainzer Landstraße · Büro vor Ort</text>
    <text x="540" y="890" text-anchor="middle" fill="rgba(255,255,255,0.55)" font-family="system-ui,sans-serif" font-size="22">Termine nach Vereinbarung</text>
    
  <g transform="translate(200,1080)">
    <rect width="280" height="240" rx="24" fill="url(#card)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    <rect x="24" y="24" width="232" height="8" rx="4" fill="#1877F2"/>
    <circle cx="140" cy="140" r="52" fill="rgba(255,255,255,0.06)" stroke="#1877F2" stroke-width="3"/>
    <text x="140" y="152" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="36">📞</text>
    <text x="140" y="250" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Telefon</text>
    <text x="140" y="290" text-anchor="middle" fill="rgba(255,255,255,0.65)" font-family="system-ui,sans-serif" font-size="20">Mo–Fr</text>
  </g>
    
  <g transform="translate(400,1080)">
    <rect width="280" height="240" rx="24" fill="url(#card)" stroke="url(#gold)" stroke-width="3"/>
    <rect x="24" y="24" width="232" height="8" rx="4" fill="url(#gold)"/>
    <circle cx="140" cy="140" r="52" fill="rgba(255,255,255,0.06)" stroke="url(#gold)" stroke-width="3"/>
    <text x="140" y="152" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="36">✉</text>
    <text x="140" y="250" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="28" font-weight="700">E-Mail</text>
    <text x="140" y="290" text-anchor="middle" fill="rgba(255,255,255,0.65)" font-family="system-ui,sans-serif" font-size="20">Antwort 24h</text>
  </g>
    
  <g transform="translate(600,1080)">
    <rect width="280" height="240" rx="24" fill="url(#card)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    <rect x="24" y="24" width="232" height="8" rx="4" fill="#057642"/>
    <circle cx="140" cy="140" r="52" fill="rgba(255,255,255,0.06)" stroke="#057642" stroke-width="3"/>
    <text x="140" y="152" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="36">📍</text>
    <text x="140" y="250" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Vor Ort</text>
    <text x="140" y="290" text-anchor="middle" fill="rgba(255,255,255,0.65)" font-family="system-ui,sans-serif" font-size="20">Frankfurt</text>
  </g>
  
  <text x="540" y="1780" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="system-ui,sans-serif" font-size="20">@kapitalmitte · Alexander Wahl Vermögensverwaltung GmbH</text>
</svg>