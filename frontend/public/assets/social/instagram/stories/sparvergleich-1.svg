<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="55%" stop-color="#123d66"/>
      <stop offset="100%" stop-color="#0d3358"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C547"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a4a7a"/>
      <stop offset="100%" stop-color="#0f3558"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#dots)"/>

  <!-- EU stars arc -->
  <g fill="#C9A227" opacity="0.85">
    <circle cx="540" cy="220" r="5"/>
    <circle cx="490" cy="240" r="4.5"/>
    <circle cx="590" cy="240" r="4.5"/>
    <circle cx="445" cy="275" r="4"/>
    <circle cx="635" cy="275" r="4"/>
    <circle cx="410" cy="320" r="3.5"/>
    <circle cx="670" cy="320" r="3.5"/>
  </g>

  <!-- Decorative curves -->
  <path d="M-40 420 Q 280 360 540 400 T 1120 380" fill="none" stroke="rgba(201,162,39,0.18)" stroke-width="2"/>
  <path d="M80 1580 Q 420 1520 540 1560 T 980 1540" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Headline area -->
  <text x="80" y="420" fill="#fff" font-family="system-ui,sans-serif" font-size="56" font-weight="800" letter-spacing="0.02em">Sparvergleich</text>
  <text x="80" y="490" fill="rgba(255,255,255,0.82)" font-family="system-ui,sans-serif" font-size="30">Tagesgeld · Flexgeld · Festgeld</text>
  <rect x="80" y="520" width="220" height="4" rx="2" fill="url(#gold)"/>

  <!-- Three product cards -->
  <g transform="translate(80,620)">
    <!-- Tagesgeld -->
    <rect width="280" height="340" rx="24" fill="url(#card)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    <rect x="24" y="24" width="232" height="8" rx="4" fill="#1877F2" opacity="0.9"/>
    <circle cx="140" cy="140" r="52" fill="rgba(24,119,242,0.15)" stroke="#1877F2" stroke-width="3"/>
    <text x="140" y="152" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="42">€</text>
    <text x="140" y="250" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Tagesgeld</text>
    <text x="140" y="290" text-anchor="middle" fill="rgba(255,255,255,0.65)" font-family="system-ui,sans-serif" font-size="20">flexibel</text>

    <!-- Flexgeld -->
    <g transform="translate(320,0)">
      <rect width="280" height="340" rx="24" fill="url(#card)" stroke="url(#gold)" stroke-width="3" filter="url(#glow)"/>
      <rect x="24" y="24" width="232" height="8" rx="4" fill="url(#gold)"/>
      <circle cx="140" cy="140" r="52" fill="rgba(201,162,39,0.18)" stroke="#C9A227" stroke-width="3"/>
      <text x="140" y="148" text-anchor="middle" fill="#E8C547" font-family="system-ui,sans-serif" font-size="34" font-weight="700">±</text>
      <text x="140" y="250" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Flexgeld</text>
      <text x="140" y="290" text-anchor="middle" fill="rgba(255,255,255,0.65)" font-family="system-ui,sans-serif" font-size="20">Kombi</text>
    </g>

    <!-- Festgeld -->
    <g transform="translate(640,0)">
      <rect width="280" height="340" rx="24" fill="url(#card)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
      <rect x="24" y="24" width="232" height="8" rx="4" fill="#057642" opacity="0.9"/>
      <circle cx="140" cy="140" r="52" fill="rgba(5,118,66,0.15)" stroke="#057642" stroke-width="3"/>
      <text x="140" y="152" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="38">🔒</text>
      <text x="140" y="250" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Festgeld</text>
      <text x="140" y="290" text-anchor="middle" fill="rgba(255,255,255,0.65)" font-family="system-ui,sans-serif" font-size="20">Laufzeit</text>
    </g>
  </g>

  <!-- Comparison bars -->
  <g transform="translate(120,1040)">
    <text x="0" y="0" fill="rgba(255,255,255,0.55)" font-family="system-ui,sans-serif" font-size="22">Zinsen auf einen Blick</text>
    <rect x="0" y="30" width="840" height="16" rx="8" fill="rgba(255,255,255,0.08)"/>
    <rect x="0" y="30" width="620" height="16" rx="8" fill="url(#gold)" opacity="0.85"/>
    <rect x="0" y="70" width="840" height="16" rx="8" fill="rgba(255,255,255,0.08)"/>
    <rect x="0" y="70" width="480" height="16" rx="8" fill="#1877F2" opacity="0.75"/>
    <rect x="0" y="110" width="840" height="16" rx="8" fill="rgba(255,255,255,0.08)"/>
    <rect x="0" y="110" width="720" height="16" rx="8" fill="#057642" opacity="0.75"/>
  </g>

  <!-- Bank count badge -->
  <g transform="translate(540,1280)">
    <rect x="-200" y="0" width="400" height="120" rx="60" fill="rgba(255,255,255,0.06)" stroke="rgba(201,162,39,0.45)" stroke-width="2"/>
    <text x="0" y="52" text-anchor="middle" fill="url(#gold)" font-family="system-ui,sans-serif" font-size="44" font-weight="800">50+</text>
    <text x="0" y="92" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-family="system-ui,sans-serif" font-size="24">EU-Partnerbanken</text>
  </g>

  <!-- Bottom brand -->
  <text x="540" y="1780" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="system-ui,sans-serif" font-size="20">@kapitalmitte · Alexander Wahl Vermögensverwaltung GmbH</text>
</svg>
