<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600"><defs><linearGradient id="bgf1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4C7CBA"/><stop offset="1" stop-color="#2F5588"/></linearGradient></defs><rect width="900" height="1600" fill="url(#bgf1)"/><text x="140" y="240" font-family="'IBM Plex Sans',sans-serif" font-size="30" fill="#FFFFFF" opacity="0.85" letter-spacing="6">FRAGE 1</text><text x="140" y="360" font-family="'IBM Plex Sans',sans-serif" font-weight="700" font-size="220" fill="#FFFFFF" opacity="0.15">?</text><text x="140" y="580" font-family="'IBM Plex Sans',sans-serif" font-weight="600" font-size="70" fill="#FFFFFF">Was ist</text><text x="140" y="670" font-family="'IBM Plex Sans',sans-serif" font-weight="600" font-size="70" fill="#FFFFFF">Tagesgeld?</text><g transform="translate(130 830)"><rect width="640" height="380" rx="24" fill="#FFFFFF"/><g transform="translate(50 50)" font-family="'IBM Plex Sans',sans-serif" fill="#1F2937"><text font-size="26" font-weight="600" fill="#4C7CBA">Kurz erklärt</text><text y="60" font-size="24">Flexible Sparform mit</text><text y="94" font-size="24">variablem Zinssatz und</text><text y="128" font-size="24">täglicher Verfügbarkeit.</text><text y="200" font-size="22" fill="#4C7CBA" font-weight="600">Typische Rolle</text><text y="240" font-size="22">Kurzfristige Liquidität und</text><text y="272" font-size="22">Reserve für ungeplante</text><text y="304" font-size="22">Ausgaben.</text></g></g><text x="450" y="1420" text-anchor="middle" font-family="'IBM Plex Sans',sans-serif" font-size="24" fill="#FFFFFF" opacity="0.9">Mehr im Beitrag „Tagesgeld vs. Festgeld"</text></svg>
