    <path d="M 420 260 h 100 a 12 12 0 0 1 12 12 v 42 a 12 12 0 0 1 -12 12 h -70 l -20 20 v -20 h -10 a 12 12 0 0 1 -12 -12 v -42 a 12 12 0 0 1 12 -12 z"/>
    <circle cx="450" cy="293" r="4" stroke="none" fill="#4C7CBA"/>
