<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-label="Langfristige Zusammenarbeit beginnt mit Vertrauen">
  <rect width="1080" height="1080" fill="#ECF3FA"/>
  <path d="M0 800 Q 360 720 720 780 T 1080 740 L 1080 1080 L 0 1080 Z" fill="#4C7CBA" opacity="0.08"/>

  <!-- Table -->
