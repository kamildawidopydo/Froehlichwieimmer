  <line x1="470" y1="562" x2="610" y2="562" stroke="#4C7CBA" stroke-width="4" stroke-linecap="round"/>
  <line x1="470" y1="580" x2="580" y2="580" stroke="#B5CBE2" stroke-width="3" stroke-linecap="round"/>
  <line x1="470" y1="596" x2="600" y2="596" stroke="#B5CBE2" stroke-width="3" stroke-linecap="round"/>

