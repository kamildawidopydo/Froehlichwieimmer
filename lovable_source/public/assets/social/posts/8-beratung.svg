  <text x="540" y="890" text-anchor="middle" font-family="'IBM Plex Sans','Helvetica Neue',sans-serif" font-weight="600" font-size="50" fill="#1F2937">Beratung mit Perspektive</text>
  <text x="540" y="945" text-anchor="middle" font-family="'IBM Plex Sans','Helvetica Neue',sans-serif" font-size="26" fill="#3A6499">Langfristige Zusammenarbeit beginnt mit Vertrauen</text>
