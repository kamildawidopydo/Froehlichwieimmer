<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-label="Diversifikation — nicht alles auf eine Karte setzen">
  <rect width="1080" height="1080" fill="#ECF3FA"/>
  <path d="M0 780 Q 360 700 720 760 T 1080 720 L 1080 1080 L 0 1080 Z" fill="#4C7CBA" opacity="0.08"/>

  <!-- Donut chart -->
  <g transform="translate(360 420)">
    <!-- Segment 1: 40% (Liquidität) 0-144deg -->
    <path d="M 0 -170 A 170 170 0 0 1 161.7 -52.5 L 95.1 -30.9 A 100 100 0 0 0 0 -100 Z" fill="#4C7CBA"/>
    <!-- Segment 2: 25% (Sparkonten) 144-234deg -->
    <path d="M 161.7 -52.5 A 170 170 0 0 1 100 137.6 L 58.8 80.9 A 100 100 0 0 0 95.1 -30.9 Z" fill="#3A6499"/>
    <!-- Segment 3: 20% (Aktien) 234-306deg -->
    <path d="M 100 137.6 A 170 170 0 0 1 -100 137.6 L -58.8 80.9 A 100 100 0 0 0 58.8 80.9 Z" fill="#7EA3D0"/>
    <!-- Segment 4: 10% (Anleihen) 306-342deg -->
    <path d="M -100 137.6 A 170 170 0 0 1 -161.7 -52.5 L -95.1 -30.9 A 100 100 0 0 0 -58.8 80.9 Z" fill="#B5CBE2"/>
    <!-- Segment 5: 5% (weitere) 342-360deg -->
    <path d="M -161.7 -52.5 A 170 170 0 0 1 0 -170 L 0 -100 A 100 100 0 0 0 -95.1 -30.9 Z" fill="#1F2937"/>
    <circle r="70" fill="#FFFFFF"/>
    <text y="12" text-anchor="middle" font-family="'IBM Plex Sans','Helvetica Neue',sans-serif" font-weight="700" font-size="42" fill="#1F2937">MIX</text>
  </g>

  <!-- Legend -->
  <g font-family="'IBM Plex Sans','Helvetica Neue',sans-serif" font-size="22" fill="#1F2937">
    <rect x="720" y="270" width="24" height="24" rx="4" fill="#4C7CBA"/>
    <text x="758" y="289">Liquidität</text>
    <rect x="720" y="320" width="24" height="24" rx="4" fill="#3A6499"/>
    <text x="758" y="339">Sparkonten</text>
    <rect x="720" y="370" width="24" height="24" rx="4" fill="#7EA3D0"/>
    <text x="758" y="389">Aktien</text>
    <rect x="720" y="420" width="24" height="24" rx="4" fill="#B5CBE2"/>
    <text x="758" y="439">Anleihen</text>
    <rect x="720" y="470" width="24" height="24" rx="4" fill="#1F2937"/>
    <text x="758" y="489">weitere</text>
  </g>

  <text x="540" y="835" text-anchor="middle" font-family="'IBM Plex Sans','Helvetica Neue',sans-serif" font-weight="600" font-size="50" fill="#1F2937">Diversifikation</text>
  <text x="540" y="885" text-anchor="middle" font-family="'IBM Plex Sans','Helvetica Neue',sans-serif" font-size="26" fill="#3A6499">Nicht alles auf eine Karte setzen</text>
  <text x="540" y="940" text-anchor="middle" font-family="'IBM Plex Sans','Helvetica Neue',sans-serif" font-size="18" fill="#6B7280">Illustrativ — keine Anlageempfehlung</text>
</svg>
